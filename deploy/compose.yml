services:
  app:
    image: notionnext:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    init: true
    env_file:
      - /opt/notionnext/runtime.env
    ports:
      - '127.0.0.1:${APP_PORT:?set APP_PORT}:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
